name: Crawl Provider Prices

on:
  workflow_call:
    inputs:
      provider:
        description: Provider crawler to run.
        required: true
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      - name: Run provider crawler
        run: npm run crawl:${{ inputs.provider }}

      - name: Generate npm data
        run: npm run generate:npm -- ${{ inputs.provider }}

      - name: Package allowlisted changes
        id: changes
        run: |
          git add -- "history/${{ inputs.provider }}" "docs/api/v1/${{ inputs.provider }}.json"
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --staged --binary -- "history/${{ inputs.provider }}" "docs/api/v1/${{ inputs.provider }}.json" > update.patch
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated update
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.provider }}-price-update
          path: update.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: crawl
    if: needs.crawl.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.provider }}-price-update
          path: generated-update

      - name: Apply allowlisted update
        run: |
          git apply --check --index \
            --include="history/${{ inputs.provider }}/*.json" \
            --include="docs/api/v1/${{ inputs.provider }}.json" \
            --exclude='*' \
            generated-update/update.patch
          git apply --index \
            --include="history/${{ inputs.provider }}/*.json" \
            --include="docs/api/v1/${{ inputs.provider }}.json" \
            --exclude='*' \
            generated-update/update.patch
          test -n "$(git diff --staged --name-only)"

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/${{ inputs.provider }}-$(date -u +%Y-%m-%d-%H%M%S)"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git switch -c "$BRANCH"
          git commit -m "Update ${{ inputs.provider }} prices $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh pr create \
            --title "Update ${{ inputs.provider }} prices $(date -u +%Y-%m-%d)" \
            --body "Automated price update from the ${{ inputs.provider }} crawler." \
            --head "$BRANCH" \
            --base main
