name: Crawl OpenRouter Prices

on:
  schedule:
    # Run at 00:01 UTC every day.
    - cron: '1 0 * * *'
  repository_dispatch:
    # Manual runs must be requested with the `crawl-openrouter` event type.
    types: [crawl-openrouter]

concurrency:
  group: crawl-openrouter
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run OpenRouter crawler
        run: npm run crawl:openrouter

      - name: Generate npm data
        run: npm run generate:npm -- openrouter

      - name: Package allowlisted changes
        id: changes
        run: |
          git add -- history/prices/openrouter.json docs/api/v1/openrouter.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --staged --binary -- history/prices/openrouter.json docs/api/v1/openrouter.json > update.patch
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated update
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: openrouter-price-update
          path: update.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: crawl
    if: needs.crawl.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated update
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openrouter-price-update
          path: generated-update

      - name: Apply allowlisted update
        run: |
          git apply --check --index \
            --include=history/prices/openrouter.json \
            --include=docs/api/v1/openrouter.json \
            --exclude='*' \
            generated-update/update.patch
          git apply --index \
            --include=history/prices/openrouter.json \
            --include=docs/api/v1/openrouter.json \
            --exclude='*' \
            generated-update/update.patch
          test -n "$(git diff --staged --name-only)"

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="data/openrouter-$(date -u +%Y-%m-%d-%H%M%S)"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git switch -c "$BRANCH"
          git commit -m "Update OpenRouter prices $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh pr create \
            --title "Update OpenRouter prices $(date -u +%Y-%m-%d)" \
            --body "Automated price update from the OpenRouter crawler." \
            --head "$BRANCH" \
            --base main
