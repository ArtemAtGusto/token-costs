name: Crawl Anthropic Prices

on:
  schedule:
    - cron: '1 0 * * *'
  repository_dispatch:
    types: [crawl-anthropic]

concurrency:
  group: crawl-anthropic
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    uses: ./.github/workflows/crawl-provider.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      provider: anthropic
      install_playwright: true
      history_include: history/anthropic/*.json
