name: Crawl OpenAI Prices

on:
  schedule:
    - cron: '1 0 * * *'
  repository_dispatch:
    types: [crawl-openai]

concurrency:
  group: crawl-openai
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    uses: ./.github/workflows/crawl-provider.yml
    permissions:
      contents: read
    with:
      provider: openai
      crawler_app_client_id: ${{ vars.CRAWLER_APP_CLIENT_ID }}
    secrets:
      crawler_app_private_key: ${{ secrets.CRAWLER_APP_PRIVATE_KEY }}
