name: Crawl OpenAI Prices

on:
  schedule:
    - cron: '1 0 * * *'
  repository_dispatch:
    types: [crawl-openai]

concurrency:
  group: crawl-openai
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    uses: ./.github/workflows/crawl-provider.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      provider: openai
      install_playwright: true
      history_include: history/openai/**
