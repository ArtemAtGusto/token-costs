name: Crawl Google Prices

on:
  schedule:
    - cron: '1 0 * * *'
  repository_dispatch:
    types: [crawl-google]

concurrency:
  group: crawl-google
  cancel-in-progress: false

jobs:
  crawl-and-publish:
    uses: ./.github/workflows/crawl-provider.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      provider: google
      install_playwright: false
      history_include: history/google/*.json
